name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & publish macOS app
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swiftc --version
          uname -m

      - name: Syntax-check the cleaning script
        run: bash -n scripts/diskautoclean.sh

      - name: Smoke-test the cleaning script
        run: |
          ./scripts/diskautoclean.sh --version
          ./scripts/diskautoclean.sh --status

      - name: Build & package (arm64 + x86_64)
        env:
          NO_OPEN: "1"
          DISKAPP_NO_PAUSE: "1"
        run: ./release.command

      - name: Show packages
        run: ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DiskCleaner-macos
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
